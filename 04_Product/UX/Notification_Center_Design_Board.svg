    <text x="430" y="166" text-anchor="middle" class="small" fill="#a8b3af">In app</text><text x="515" y="166" text-anchor="middle" class="small" fill="#a8b3af">On device</text>
    <rect x="35" y="180" width="610" height="178" rx="19" fill="#182220" stroke="#2c3a37"/>
    <text x="55" y="211" class="strong" fill="#f4f6f3">Requests</text><text x="55" y="228" class="small" fill="#a8b3af">Friends, Support Circle and verification</text>
    <rect x="412" y="198" width="38" height="22" rx="11" fill="#59c8be"/><circle cx="440" cy="209" r="8" fill="#182220"/><rect x="497" y="198" width="38" height="22" rx="11" fill="#59c8be"/><circle cx="525" cy="209" r="8" fill="#182220"/>
    <line x1="50" y1="246" x2="630" y2="246" stroke="#2c3a37"/><text x="55" y="274" class="strong" fill="#f4f6f3">Friends and social activity</text>
    <rect x="412" y="260" width="38" height="22" rx="11" fill="#59c8be"/><circle cx="440" cy="271" r="8" fill="#182220"/><rect x="497" y="260" width="38" height="22" rx="11" fill="#2c3a37"/><circle cx="506" cy="271" r="8" fill="#a8b3af"/>
    <line x1="50" y1="302" x2="630" y2="302" stroke="#2c3a37"/><text x="55" y="330" class="strong" fill="#f4f6f3">Help and support</text>
    <rect x="412" y="316" width="38" height="22" rx="11" fill="#59c8be"/><circle cx="440" cy="327" r="8" fill="#182220"/><rect x="497" y="316" width="38" height="22" rx="11" fill="#59c8be"/><circle cx="525" cy="327" r="8" fill="#182220"/>
    <rect x="35" y="375" width="610" height="63" rx="18" fill="#20312e"/>
    <text x="55" y="403" class="strong" fill="#f4f6f3">System and account</text><text x="55" y="421" class="small" fill="#a8b3af">Essential notifications are always on</text><text x="430" y="412" text-anchor="middle" class="body" fill="#a8b3af">🔒</text><text x="515" y="412" text-anchor="middle" class="body" fill="#a8b3af">🔒</text>
