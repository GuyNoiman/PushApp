    <rect x="230" y="198" width="38" height="22" rx="11" fill="#59c8be"/><circle cx="258" cy="209" r="8" fill="#182220"/><rect x="145" y="198" width="38" height="22" rx="11" fill="#59c8be"/><circle cx="173" cy="209" r="8" fill="#182220"/>
    <line x1="50" y1="246" x2="630" y2="246" stroke="#2c3a37"/><text x="610" y="274" text-anchor="end" class="strong he" fill="#f4f6f3" direction="rtl">חברים ופעילות חברתית</text>
    <rect x="230" y="260" width="38" height="22" rx="11" fill="#59c8be"/><circle cx="258" cy="271" r="8" fill="#182220"/><rect x="145" y="260" width="38" height="22" rx="11" fill="#2c3a37"/><circle cx="154" cy="271" r="8" fill="#a8b3af"/>
    <line x1="50" y1="302" x2="630" y2="302" stroke="#2c3a37"/><text x="610" y="330" text-anchor="end" class="strong he" fill="#f4f6f3" direction="rtl">עזרה ותמיכה</text>
    <rect x="230" y="316" width="38" height="22" rx="11" fill="#59c8be"/><circle cx="258" cy="327" r="8" fill="#182220"/><rect x="145" y="316" width="38" height="22" rx="11" fill="#59c8be"/><circle cx="173" cy="327" r="8" fill="#182220"/>
    <rect x="35" y="375" width="610" height="63" rx="18" fill="#20312e"/>
    <text x="610" y="403" text-anchor="end" class="strong he" fill="#f4f6f3" direction="rtl">מערכת וחשבון</text><text x="610" y="421" text-anchor="end" class="small he" fill="#a8b3af" direction="rtl">התראות חיוניות תמיד פעילות</text><text x="250" y="412" text-anchor="middle" class="body" fill="#a8b3af">🔒</text><text x="165" y="412" text-anchor="middle" class="body" fill="#a8b3af">🔒</text>
  </g>

  <!-- English LTR Dark Preferences -->
  <g transform="translate(865 625)">
    <text x="340" y="0" text-anchor="middle" class="label" fill="#1c2926">English · LTR · Dark</text>
    <rect x="0" y="20" width="680" height="450" rx="34" fill="#101817" filter="url(#shadow)"/>
