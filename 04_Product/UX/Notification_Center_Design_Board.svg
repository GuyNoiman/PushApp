<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">PushApp Notification Center direction and appearance board</title>
  <desc id="desc">Four mobile screen concepts: Hebrew RTL Light and Dark, English LTR Light and Dark, showing the feed and notification preferences.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-opacity=".13"/></filter>
    <style>
      .board-title{font:500 30px Inter,Arial,sans-serif;fill:#1c2926}.board-sub{font:400 15px Inter,Arial,sans-serif;fill:#66716e}
      .label{font:500 17px Inter,Arial,sans-serif}.h1{font:500 23px Inter,Arial,sans-serif}.body{font:400 13px Inter,Arial,sans-serif}.strong{font:500 13px Inter,Arial,sans-serif}.small{font:400 11px Inter,Arial,sans-serif}.button{font:500 11px Inter,Arial,sans-serif}.he{font-family:"Arial Hebrew",Arial,sans-serif}
    </style>
  </defs>
  <rect width="1600" height="1120" rx="32" fill="#eef1ee"/>
  <text x="800" y="52" text-anchor="middle" class="board-title">Notification Center · Direction &amp; Appearance</text>
  <text x="800" y="80" text-anchor="middle" class="board-sub">Approved hierarchy: row tap for navigation · decision pair · equal social responses</text>

  <!-- Hebrew RTL Light -->
  <g transform="translate(55 115)">
    <text x="340" y="0" text-anchor="middle" class="label" fill="#1c2926">Hebrew · RTL · Light</text>
    <rect x="0" y="20" width="680" height="450" rx="34" fill="#f7f6f2" filter="url(#shadow)"/>
    <text x="630" y="60" text-anchor="end" class="small" fill="#182321">9:41</text>
    <text x="625" y="104" text-anchor="end" class="h1 he" fill="#182321" direction="rtl">התראות</text>
    <circle cx="55" cy="96" r="19" fill="#fff" stroke="#e1e5e2"/><text x="55" y="102" text-anchor="middle" class="body" fill="#182321">⚙</text>
    <text x="625" y="134" text-anchor="end" class="small he" fill="#66716e" direction="rtl">חדש</text>
    <rect x="35" y="150" width="610" height="105" rx="18" fill="#eef6f4"/>
    <circle cx="608" cy="184" r="22" fill="#e96f61"/><text x="608" y="189" text-anchor="middle" class="strong he" fill="#fff">נ</text><circle cx="55" cy="168" r="4" fill="#087c78"/>
    <text x="575" y="177" text-anchor="end" class="strong he" fill="#182321" direction="rtl">נועה פרגנה לך על ההתקדמות השבוע</text>
    <text x="575" y="197" text-anchor="end" class="small he" fill="#66716e" direction="rtl">לפני 8 דקות</text>
    <rect x="425" y="211" width="150" height="31" rx="10" fill="none" stroke="#d6ddda"/><text x="500" y="231" text-anchor="middle" class="button he" fill="#182321" direction="rtl">פרגון בחזרה</text>
    <rect x="320" y="211" width="95" height="31" rx="10" fill="none" stroke="#d6ddda"/><text x="367" y="231" text-anchor="middle" class="button he" fill="#182321" direction="rtl">הודעה</text>
    <rect x="35" y="267" width="610" height="118" rx="18" fill="#eef6f4"/>
    <circle cx="608" cy="301" r="22" fill="#087c78"/><text x="608" y="306" text-anchor="middle" class="strong he" fill="#fff">א</text><circle cx="55" cy="285" r="4" fill="#087c78"/>
    <text x="575" y="293" text-anchor="end" class="strong he" fill="#182321" direction="rtl">איתי מבקש לצרף אותך למעגל התמיכה</text>
    <text x="575" y="313" text-anchor="end" class="small he" fill="#66716e" direction="rtl">לפני 24 דקות</text>
    <rect x="458" y="331" width="117" height="36" rx="11" fill="#087c78"/><text x="516" y="354" text-anchor="middle" class="button he" fill="#fff" direction="rtl">אישור</text>
    <text x="414" y="354" text-anchor="middle" class="button he" fill="#66716e" direction="rtl">דחייה</text>
    <text x="625" y="414" text-anchor="end" class="small he" fill="#66716e" direction="rtl">מוקדם יותר</text>
    <rect x="35" y="425" width="610" height="31" rx="15" fill="#fff" stroke="#e1e5e2"/>
  </g>

  <!-- English LTR Light -->
  <g transform="translate(865 115)">
    <text x="340" y="0" text-anchor="middle" class="label" fill="#1c2926">English · LTR · Light</text>
    <rect x="0" y="20" width="680" height="450" rx="34" fill="#f7f6f2" filter="url(#shadow)"/>
    <text x="50" y="60" class="small" fill="#182321">9:41</text>
