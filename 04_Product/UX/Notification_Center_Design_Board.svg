    <circle cx="625" cy="96" r="19" fill="#fff" stroke="#e1e5e2"/><text x="625" y="102" text-anchor="middle" class="body" fill="#182321">⚙</text>
    <text x="55" y="134" class="small" fill="#66716e">New</text>
    <rect x="35" y="150" width="610" height="105" rx="18" fill="#eef6f4"/>
    <circle cx="72" cy="184" r="22" fill="#e96f61"/><text x="72" y="189" text-anchor="middle" class="strong" fill="#fff">N</text><circle cx="625" cy="168" r="4" fill="#087c78"/>
    <text x="105" y="177" class="strong" fill="#182321">Noa cheered your progress this week</text>
    <text x="105" y="197" class="small" fill="#66716e">8 minutes ago</text>
    <rect x="105" y="211" width="125" height="31" rx="10" fill="none" stroke="#d6ddda"/><text x="167" y="231" text-anchor="middle" class="button" fill="#182321">Cheer back</text>
    <rect x="240" y="211" width="90" height="31" rx="10" fill="none" stroke="#d6ddda"/><text x="285" y="231" text-anchor="middle" class="button" fill="#182321">Message</text>
    <rect x="35" y="267" width="610" height="118" rx="18" fill="#eef6f4"/>
    <circle cx="72" cy="301" r="22" fill="#087c78"/><text x="72" y="306" text-anchor="middle" class="strong" fill="#fff">A</text><circle cx="625" cy="285" r="4" fill="#087c78"/>
    <text x="105" y="293" class="strong" fill="#182321">Amit invited you to his Support Circle</text>
    <text x="105" y="313" class="small" fill="#66716e">24 minutes ago</text>
    <rect x="105" y="331" width="117" height="36" rx="11" fill="#087c78"/><text x="163" y="354" text-anchor="middle" class="button" fill="#fff">Approve</text>
    <text x="267" y="354" text-anchor="middle" class="button" fill="#66716e">Decline</text>
    <text x="55" y="414" class="small" fill="#66716e">Earlier</text>
    <rect x="35" y="425" width="610" height="31" rx="15" fill="#fff" stroke="#e1e5e2"/>
  </g>

  <!-- Hebrew RTL Dark Preferences -->
